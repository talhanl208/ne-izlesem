{% extends "base.html" %}
{% block title %}{{ title or 'Bir sorun çıktı' }} — Ne İzlesem?{% endblock %}
{% block body_class %}page-error{% endblock %}
{% block content %}
<section class="error-page">
  <p class="error-reel" aria-hidden="true"></p>
  <h1 class="foil">{{ title or 'Bir sorun çıktı' }}</h1>
  <p>{{ message }}</p>
  <p class="error-actions">
    {% if retry %}<button type="button" class="btn-gold" data-reload>Tekrar dene</button>{% endif %}
    <a class="btn-ghost" href="{{ url_for('main.index') }}">Ana sayfaya dön</a>
  </p>
</section>
{% endblock %}
